name: Daily Select

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target date (YYYYMMDD, leave empty for tomorrow)'
        required: false
        type: string
  schedule:
    - cron: '7 14 * * *'   # 23:07 JST daily
    - cron: '37 15 * * *'  # 00:37 JST backup

jobs:
  daily-select:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Get date
        id: get_date
        run: |
          if [ -z "${{ github.event.inputs.target_date }}" ]; then
            echo "date=$(TZ=Asia/Tokyo date -d '+1 day' +%Y%m%d)" >> $GITHUB_OUTPUT
          else
            echo "date=${{ github.event.inputs.target_date }}" >> $GITHUB_OUTPUT
          fi
          echo "Target date: $(cat $GITHUB_OUTPUT | grep date | cut -d'=' -f2)"

      - name: Run daily select
        run: |
          python scripts/daily_select.py ${{ steps.get_date.outputs.date }}

      - name: Check race cancellation
        id: check_cancel
        run: |
          # ✅ フルパス指定を追加
          JSON_FILE="${GITHUB_WORKSPACE}/today_jobs.latest.json"
          
          echo "📂 Checking file: $JSON_FILE"
          
          if [ ! -f "$JSON_FILE" ]; then
            echo "❌ レースデータが取得できませんでした"
            echo "cancelled=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "✅ File found"
          
          RACE_COUNT=$(jq '.total_race_count // 0' "$JSON_FILE")
          
          echo "📊 Race count: $RACE_COUNT"
          
          if [ "$RACE_COUNT" -eq 0 ]; then
            echo "ℹ️ 本日は開催レースがありません"
            echo "cancelled=true" >> $GITHUB_OUTPUT
          else
            echo "✅ 本日は${RACE_COUNT}レース開催"
            echo "cancelled=false" >> $GITHUB_OUTPUT
          fi

      - name: Fetch shutuba data
        if: steps.check_cancel.outputs.cancelled == 'false'
        run: |
          python scripts/fetch_shutuba.py ${{ steps.get_date.outputs.date }}

      - name: Fetch past races data
        if: steps.check_cancel.outputs.cancelled == 'false'
        run: |
          python scripts/fetch_past_races.py ${{ steps.get_date.outputs.date }}

      - name: Calculate DES scores
        if: steps.check_cancel.outputs.cancelled == 'false'
        run: |
          python scripts/calculate_des.py ${{ steps.get_date.outputs.date }}

      - name: Calculate NEW scores
        if: steps.check_cancel.outputs.cancelled == 'false'
        run: |
          python scripts/calculate_new_score.py race_data_${{ steps.get_date.outputs.date }}.json

      - name: Select predictions
        if: steps.check_cancel.outputs.cancelled == 'false'
        run: |
          python scripts/select_predictions.py ${{ steps.get_date.outputs.date }}

      - name: Commit race_data JSON
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          # 通常時: race_data, final_predictions, latest_predictions
          # 開催なし時: final_predictions_{ymd}.json(no_race), latest_predictions.json のみ
          git add race_data_*.json 2>/dev/null || true
          git add final_predictions_*.json latest_predictions.json today_jobs.latest.json
          git diff --cached --quiet || git commit -m "Add race_data for ${{ steps.get_date.outputs.date }}"
          git push || true

      - name: Refresh recent results and statistics
        run: |
          JST_HOUR=$(TZ=Asia/Tokyo date +%H)
          if [ "${JST_HOUR}" -lt 6 ]; then
            RESULT_DATE=$(TZ=Asia/Tokyo date -d 'yesterday' +%Y%m%d)
            MODE='auto-yesterday'
          else
            RESULT_DATE=$(TZ=Asia/Tokyo date +%Y%m%d)
            MODE='auto-today'
          fi
          echo "📅 結果更新対象日: ${RESULT_DATE} (${MODE})"

          python scripts/fetch_race_results.py "${RESULT_DATE}" || true
          python scripts/audit_recent_results.py --base-ymd "${RESULT_DATE}" --lookback-days 14 || true

          if [ -f recent_results_audit.json ]; then
            LATEST_COMPLETE=$(python - <<'PY'
import json
with open('recent_results_audit.json', 'r', encoding='utf-8') as f:
    data = json.load(f)
print(data.get('latest_complete_ymd') or '')
PY
)
            if [ -n "${LATEST_COMPLETE}" ] && [ -f "race_results_${LATEST_COMPLETE}.json" ]; then
              cp "race_results_${LATEST_COMPLETE}.json" latest_results.json
              cp "race_results_${LATEST_COMPLETE}.json" latest_complete_results.json
              echo "✅ latest_results.json を race_results_${LATEST_COMPLETE}.json に同期"
            fi
          fi

          python scripts/generate_stats.py || echo "⚠️ generate_stats.py failed, continuing..."

          if [ -n "${LATEST_COMPLETE}" ] && [ -f "final_predictions_${LATEST_COMPLETE}.json" ] && [ -f "race_results_${LATEST_COMPLETE}.json" ]; then
            cp "final_predictions_${LATEST_COMPLETE}.json" predictions.json
            cp "race_results_${LATEST_COMPLETE}.json" results.json
            python3 scripts/generate_reports.py daily predictions.json results.json statistics.json || echo "⚠️ generate_reports.py failed, continuing..."
            REPORT_FILE=$(ls -1t daily_report_*.json 2>/dev/null | head -n 1)
            if [ -n "${REPORT_FILE}" ]; then
              TARGET_REPORT="daily_report_${LATEST_COMPLETE}.json"
              cp "${REPORT_FILE}" "${TARGET_REPORT}"
              echo "✅ ${TARGET_REPORT} を更新"
            fi
          fi

      - name: Commit refreshed public data
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add race_results_*.json latest_results.json latest_complete_results.json recent_results_audit.json statistics.json daily_report_*.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Refresh results/statistics after daily select"
          git push || true

      - name: Generate final output
        if: steps.check_cancel.outputs.cancelled == 'false'
        run: |
          echo "✅ 予想データを生成しました"

      - name: Validate predictions
        if: steps.check_cancel.outputs.cancelled == 'false'
        run: |
          if [ ! -f "latest_predictions.json" ]; then
            echo "❌ latest_predictions.json が生成されませんでした"
            exit 1
          fi
          echo "✅ latest_predictions.json を確認しました"
